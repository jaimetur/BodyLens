[project]
name = "bodylens"
version = "0.1.0"
description = "Servidor de BodyLens: app personal de salud multiusuario"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.34.0",
  "httpx==0.28.1",
  "argon2-cffi==23.1.0",
  "google-auth==2.37.0",
  "requests==2.32.3",
]

[project.optional-dependencies]
test = [
  "pytest==8.3.4",
  "respx==0.22.0",
]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
