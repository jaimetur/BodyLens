<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BodyLens · Help</title><meta name="theme-color" content="#3B7BF2">
<link rel="icon" type="image/svg+xml" href="/icon.svg"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/pages.css">
<style>
.hlp{display:grid;grid-template-columns:minmax(220px,280px) minmax(0,1fr);gap:18px;align-items:start}
.hnav{position:sticky;top:12px;padding:14px!important}
.hnav h3{font-size:12px;letter-spacing:.08em;text-transform:uppercase;margin:14px 10px 6px;color:var(--accent2)}
.hnav h3:first-child{margin-top:4px}
.hnav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;color:var(--ink);text-decoration:none;font-weight:600;font-size:15.5px}
.hnav a i{font-style:normal;width:30px;height:30px;flex:none;display:grid;place-items:center;border-radius:9px;font-size:16px;background:var(--hc,var(--raised))}
.hnav a:hover{background:var(--raised)}
.hnav a.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 6px 18px rgba(59,123,242,.28)}
.hnav a.on i{background:rgba(255,255,255,.22)}
.hlang select{width:auto;display:inline-block;padding:5px 8px;font-size:14px}
.hpn{display:flex;justify-content:space-between;gap:10px;margin:0 0 18px}
.hpn.bottom{margin:28px 0 0;padding-top:18px;border-top:2px dashed var(--line)}
.hpn a{display:flex;align-items:center;gap:8px;max-width:48%;padding:9px 14px;border-radius:12px;text-decoration:none;font-weight:600;font-size:15px;
  color:var(--accent);background:color-mix(in srgb,var(--accent) 9%,var(--surface));border:1px solid color-mix(in srgb,var(--accent) 25%,var(--line))}
.hpn a:hover{background:color-mix(in srgb,var(--accent) 16%,var(--surface))}
.hpn a.next{margin-left:auto;text-align:right;justify-content:flex-end}
.hpn a small{display:block;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.hpn a span{min-width:0}
.hpn b{font-weight:700;overflow:hidden;text-overflow:ellipsis;display:block}
.hpick{display:none;width:100%;margin-bottom:12px;font-size:16px}
.hdoc{min-width:0;padding:26px 30px 30px!important}
.hnote{font-size:14px;border-radius:12px;padding:10px 14px;margin:0 0 18px;background:color-mix(in srgb,var(--accent) 10%,var(--surface));border:1px solid color-mix(in srgb,var(--accent) 30%,var(--line));color:var(--ink)}
.md{line-height:1.7;font-size:17px;overflow-wrap:break-word}
.md h1{font-family:"Big Shoulders Display","Instrument Sans",sans-serif;font-weight:800;font-size:38px;text-transform:uppercase;letter-spacing:.02em;margin:0 0 18px;
  background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.md h2{font-size:23px;margin:34px 0 12px;padding:4px 0 4px 14px;border-left:5px solid var(--accent);border-radius:2px}
.md h2:nth-of-type(3n+2){border-left-color:var(--accent2)}
.md h2:nth-of-type(3n){border-left-color:var(--ok)}
.md h3{font-size:19px;margin:24px 0 8px;color:var(--accent2)}
.md h4{font-size:16px;margin:20px 0 8px;color:var(--accent)}
.md p{margin:0 0 12px}
.md ul,.md ol{margin:0 0 14px;padding-left:24px}
.md li{margin:5px 0}
.md li::marker{color:var(--accent)}
.md strong{color:var(--ink);font-weight:700}
.md li>strong:first-child{color:var(--accent2)}
.md code{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:.86em;background:color-mix(in srgb,var(--accent2) 9%,var(--surface));border:1px solid color-mix(in srgb,var(--accent2) 22%,var(--line));border-radius:6px;padding:1px 6px}
.md pre{background:var(--raised);border:1px solid var(--line);border-left:4px solid var(--accent2);border-radius:12px;padding:14px 16px;overflow:auto;font-size:14px;line-height:1.5}
.md pre code{background:none;border:0;padding:0}
.md .tbl{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 0 16px;border:1px solid var(--line);border-radius:12px}
.md table{border-collapse:collapse;font-size:15.5px;width:100%}
.md th,.md td{border-bottom:1px solid var(--line);padding:9px 12px;text-align:left;vertical-align:top;overflow-wrap:normal;word-break:normal;min-width:6.5em}
.md td:first-child,.md th:first-child{min-width:7.5em}
.md tr:last-child td{border-bottom:0}
.md th{background:color-mix(in srgb,var(--accent) 12%,var(--surface));color:var(--ink);font-size:13px;text-transform:uppercase;letter-spacing:.04em}
.md tbody tr:nth-child(even){background:color-mix(in srgb,var(--accent) 4%,transparent)}
.md blockquote{margin:0 0 14px;padding:8px 16px;border-left:4px solid var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--surface));border-radius:0 10px 10px 0}
.md hr{border:0;border-top:2px dashed var(--line);margin:26px 0}
.md a{color:var(--accent);font-weight:600}
@media (max-width:760px){.hlp{grid-template-columns:1fr}.hnav{display:none}.hpick{display:block}.hdoc{padding:16px 14px!important;border-radius:14px}
  .md{font-size:15.5px;line-height:1.6}.md h1{font-size:28px}.md h2{font-size:19px;margin:26px 0 10px;padding-left:10px}.md h3{font-size:17px}
  .md table{font-size:14px}.md th,.md td{padding:7px 9px}.md ul,.md ol{padding-left:20px}.md pre{font-size:12.5px;padding:10px 12px}
  .top{flex-wrap:wrap;gap:10px}.top>span{display:flex;width:100%;justify-content:space-between;align-items:center;gap:8px}}
</style></head>
<body><main class="acct">
  <div class="top"><a class="brand" href="/"><img src="/icon.svg" alt=""><b>BodyLens · Help</b></a><span><label class="hlang">🌐 <select id="langPick2" aria-label="Language"></select></label> <a class="btn ghost" href="/">Back to the app</a></span></div>
  <select class="hpick" id="pick" aria-label="Help"></select>
  <div class="hlp">
    <nav class="card hnav" id="nav" aria-label="Help"></nav>
    <section class="card hdoc">
      <p class="hnote" id="note" hidden></p>
      <nav class="hpn" id="pnTop" aria-label="Help"></nav>
      <article class="md" id="doc" data-noi18n><p class="small">…</p></article>
      <nav class="hpn bottom" id="pnBot" aria-label="Help"></nav>
    </section>
  </div>
</main>
<script src="/pages.js"></script>
<script>
let IDX = null, CUR = null, POLL = null;
const docOf = () => decodeURIComponent((location.hash || '#home').slice(1)) || 'home';
// an emoji and a colour per document, so the index is easy to scan
const ICONS = { home: ['🏠', 'rgba(59,123,242,.16)'], summary: ['📊', 'rgba(59,123,242,.16)'], weight: ['⚖️', 'rgba(124,92,240,.16)'], body: ['🧍', 'rgba(20,160,140,.16)'],
  activity: ['🏃', 'rgba(31,157,107,.16)'], sleep: ['🌙', 'rgba(91,91,240,.16)'], meals: ['🍽️', 'rgba(240,140,40,.18)'], intimate: ['💗', 'rgba(230,70,130,.16)'],
  history: ['📈', 'rgba(120,130,145,.16)'], settings: ['⚙️', 'rgba(120,130,145,.16)'], accounts: ['👤', 'rgba(59,123,242,.16)'], couples: ['👥', 'rgba(230,70,130,.16)'],
  import: ['📥', 'rgba(30,150,200,.16)'], sync: ['🔄', 'rgba(31,157,107,.16)'], administration: ['🛡️', 'rgba(214,69,69,.16)'], readme: ['📘', 'rgba(59,123,242,.16)'],
  changelog: ['🆕', 'rgba(240,190,30,.2)'] };
function navHtml() {
  const item = (id, t, own) => { const [e, c] = ICONS[id] || ['📄', 'var(--raised)'];
    return `<a href="#${id}" data-id="${id}" style="--hc:${c}"><i aria-hidden="true">${e}</i><span${own ? ' data-noi18n' : ''}>${esc(t)}</span></a>`; };
  return `<h3>Help</h3>${item('home', 'Home')}${IDX.modules.map(m => item(m.id, m.title, true)).join('')}
    <h3>BodyLens</h3>${item('readme', 'About BodyLens')}${item('changelog', "What's new")}`;
}
// previous / next section, in the order of the index, above and below each document
function prevNext(doc) {
  const items = [...document.querySelectorAll('#nav a')].map(a => ({ id: a.dataset.id, ico: a.querySelector('i').textContent, t: a.querySelector('span').textContent }));
  const i = items.findIndex(x => x.id === doc);
  const link = (x, cls, lbl) => x ? `<a href="#${x.id}" class="${cls}"><span><small>${esc(lbl)}</small><b>${cls === 'prev' ? '← ' : ''}${x.ico} ${esc(x.t)}${cls === 'next' ? ' →' : ''}</b></span></a>` : '';
  const html = i < 0 ? '' : link(items[i - 1], 'prev', (window.blT || String)('Previous')) + link(items[i + 1], 'next', (window.blT || String)('Next'));
  $('pnTop').innerHTML = html; $('pnBot').innerHTML = html;
}
function mark() {
  document.querySelectorAll('#nav a').forEach(a => a.classList.toggle('on', a.dataset.id === CUR));
  $('pick').value = CUR;
}
async function load(doc, quiet) {
  CUR = doc; mark();
  clearTimeout(POLL);
  try {
    const r = await api('GET', '/api/help/' + encodeURIComponent(doc));
    if (CUR !== doc) return;
    $('doc').setAttribute('lang', r.shown);
    $('doc').innerHTML = r.html;
    prevNext(doc);
    const n = $('note');
    if (r.lang !== 'en' && r.shown === 'en') {
      n.hidden = false;
      n.textContent = r.pending ? 'The translation into your language is being prepared; meanwhile this page is shown in English.'
        : 'Automatic translation is not set up on this server, so the help is shown in English.';
      if (r.pending) POLL = setTimeout(() => load(doc, true), 6000);
    } else n.hidden = true;
    if (!quiet) { scrollTo(0, 0); try { TOP.scrollTo(0, 0) } catch (e) { } }
  } catch (e) { $('doc').innerHTML = `<p class="msg err">${esc(e.message)}</p>`; }
}
document.addEventListener('click', e => {
  const a = e.target.closest('[data-doc]');
  if (a) { e.preventDefault(); location.hash = a.dataset.doc; }
});
addEventListener('hashchange', () => load(docOf()));
// language: signed in, it is the account's; otherwise the one kept in this browser
langPicker($('langPick2'), async l => {
  try { await api('POST', '/api/me/lang', { lang: l }); } catch (e) { setLangCookie(l); }
  location.reload();
});
$('pick').addEventListener('change', () => { location.hash = $('pick').value; });
(async () => {
  try {
    IDX = await api('GET', '/api/help');
    $('nav').innerHTML = navHtml();
    $('pick').innerHTML = [...$('nav').querySelectorAll('a')].map(a => `<option value="${a.dataset.id}">${esc(a.querySelector('i').textContent + '  ' + (a.querySelector('span[data-noi18n]') ? a.querySelector('span').textContent : (window.blT || String)(a.querySelector('span').textContent)))}</option>`).join('');
  } catch (e) { $('nav').innerHTML = `<p class="msg err">${esc(e.message)}</p>`; }
  load(docOf());
})();
</script>
</body></html>
