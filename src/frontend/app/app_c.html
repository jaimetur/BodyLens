
<script>
/* =========================================================
   Estado, almacenamiento en la cuenta y sincronización
   ========================================================= */
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let LS='bascula:v3';
let DOC=null,HIST={},MED={v:1,e:{}},ACT={},SLP={},WO={},FOOD={},HK={},ECG={},HKEV={v:1,e:[]},HKLOG={v:1,e:[]},NAP={},col=null,mcp=null,M=null,LIFE=null,lastFetch=null;
const loadLocal=()=>{try{return JSON.parse(localStorage.getItem(LS)||'null')}catch(e){return null}};
const saveLocal=()=>{try{localStorage.setItem(LS,JSON.stringify({doc:DOC,hist:HIST,med:MED,act:ACT,slp:SLP,wo:WO,food:FOOD,hk:HK,ecg:ECG,hkev:HKEV,hklog:HKLOG,nap:NAP}))}catch(e){}};
// comparación estable: la base de datos puede devolver las claves en otro orden
const canon=x=>JSON.stringify(x,(k,v)=>v&&typeof v==='object'&&!Array.isArray(v)?Object.keys(v).sort().reduce((o,kk)=>(o[kk]=v[kk],o),{}):v);
const mainOf=d=>canon({manual:d.manual||{},notes:d.notes||{},milestones:d.milestones||[],cfg:d.cfg||{},cfgEdited:!!d.cfgEdited,legacy:!!(d.w||d.h2013)});

/* Copia de los datos dentro de la propia página: quien abre el enlace sin iniciar sesión en claude.ai no puede leer el
   espacio de datos de la app, así que ve esta copia. La página guarda su propio código (SELF) para poder volver a
   publicarse con la copia al día cuando Jaime la usa. Los marcadores los rellena la publicación. */
const PACK="@@PACK@@";
let SNAP=null,SELF_T='';
const SHELL_A='<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.4 system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body>';
const u8ToB64=u8=>{let s='';for(let i=0;i<u8.length;i+=0x8000)s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));return btoa(s)};
async function gzipB64(str){const st=new Blob([str]).stream().pipeThrough(new CompressionStream('gzip'));return u8ToB64(new Uint8Array(await new Response(st).arrayBuffer()))}
async function gunzipB64(b64){const bin=atob(b64);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
  const st=new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'));return await new Response(st).text()}
// desempaqueta la copia que lleva la página: {self: código de la página con el marcador, snap: datos}
async function unpack(){if(PACK.length<100||typeof DecompressionStream==='undefined')return;
  try{const p=JSON.parse(await gunzipB64(PACK));SNAP=p.snap||null;SELF_T=p.self||''}catch(e){console.error(e)}}
async function buildPage(snap){const tP='"'+'@@'+'PACK'+'@@"';const pack=await gzipB64(JSON.stringify({self:SELF_T,snap}));
  return SHELL_A+SELF_T.split(tP).join('"'+pack+'"')+'</body></html>'}

// preferencias de esta vista (periodo elegido, series ocultas): solo comodidad, viven en este dispositivo
const UI=(()=>{try{return JSON.parse(localStorage.getItem('bascula:ui')||'{}')||{}}catch(e){return {}}})();
// what each profile had open (section in the address, tabs of each section) is kept apart, to reopen it when entering that profile
// (kept in this browser and, on the server, in the account, so a restart or another device reopens the same place)
let NAV_T=null,NAV_LAST='';
function navPush(){if(!window.BODYLENS_SERVER)return;clearTimeout(NAV_T);NAV_T=setTimeout(()=>{const s=JSON.stringify(UI.byProf||{});if(s===NAV_LAST)return;NAV_LAST=s;
  fetch('/api/me/nav',{method:'POST',headers:{'Content-Type':'application/json','X-BodyLens':'1'},body:JSON.stringify({nav:UI.byProf||{}}),keepalive:true}).catch(()=>{NAV_LAST=''})},1500)}
const saveUI=()=>{try{if(typeof SEL==='string'){const cur=(UI.byProf||{})[SEL]||{},nx={h:location.hash,vt:UI.vt,lastSub:UI.lastSub,ajTab:UI.ajTab,ajTabPf:UI.ajTabPf};
    if(JSON.stringify({...cur,t:0})!==JSON.stringify({...nx,t:0})){UI.byProf={...(UI.byProf||{}),[SEL]:{...nx,t:Date.now()}};navPush()}}}catch(e){}
  try{localStorage.setItem('bascula:ui',JSON.stringify(UI))}catch(e){}};
// what the server keeps wins over this browser's copy when it is newer (another device, or this browser's data was cleared)
try{const srv=(window.BODYLENS_USER&&BODYLENS_USER.nav)||{},loc=UI.byProf||{};const m={...loc};
  for(const [k,v] of Object.entries(srv))if(v&&typeof v==='object'&&(!loc[k]||(v.t||0)>(loc[k].t||0)))m[k]=v;UI.byProf=m;NAV_LAST=JSON.stringify(srv)}catch(e){}
/* ---------- perfiles: cada persona tiene sus propios documentos («pf-<id>-…»); el perfil principal usa los de siempre ---------- */
const PROF_DEF=[{"id":"","name":"Jaime Tur","col":"#3f51e0","partner":"laura","pinH":"b306e613261e589c95f54353e7647436ad522b508d1a7ea41bccfd24741623bb","partnerSince":"2026-03-01"},{"id":"laura","name":"Laura Romero","col":"#d6457a","cycle":1,"partner":"","pinH":"4e68ba88e45912c2d4a386c50521c22abda50a12b692992e00851267670516a9","partnerSince":"2026-03-01"}];
let PROFS=(()=>{try{const p=JSON.parse(localStorage.getItem('bascula:profs')||'null');return Array.isArray(p)&&p.length?p:PROF_DEF}catch(e){return PROF_DEF}})();
// profiles are access levels over the same data: SEL is the profile in use (modules, PIN); PID, the data owner, is always the main one
// the profile in use in this tab: the one entered in this session; otherwise the first one in the list. If it has a PIN,
// the lock screen asks for it, and the PIN typed decides which profile opens
const SEL=(()=>{let s=null;try{s=sessionStorage.getItem('bascula:sel')}catch(e){}if(s!=null&&PROFS.some(p=>p.id===s))return s;
  return PROFS[0]?PROFS[0].id:''})();const PID='';
if(PID)LS='bascula:v3:'+PID;
// entering a profile (or opening the app without a section in the address) reopens the section and tabs it had open
{const b=UI.byProf&&UI.byProf[SEL],sw=!!UI.pfSwitch;delete UI.pfSwitch;delete UI.pfRet;
  if(b){for(const k of ['vt','lastSub','ajTab','ajTabPf'])if(b[k]!==undefined)UI[k]=b[k];
    if(b.h&&(sw||!location.hash)&&location.hash!==b.h){try{history.replaceState(null,'',b.h)}catch(e){location.hash=b.h}}}
  else if(sw){try{history.replaceState(null,'','#resumen')}catch(e){}}}
addEventListener('hashchange',()=>saveUI());
const PROF=()=>PROFS.find(p=>p.id===SEL)||PROFS[0];
const dk=id=>PID?`pf-${PID}-${id}`:id;
const CYC_T=['menstrual','intermenstrual','ovulation','bbt','cervical','contraceptive','pregnancy'];
const OTHER={};
// registros de otro perfil: de la colección, de la copia de la página o de este dispositivo
function otherLog(id){const key=id?`pf-${id}-hklog`:'hklog';if(!id&&PID&&OTHER.mainHklog)return OTHER.mainHklog;if(id&&OTHER[key])return OTHER[key];
  const S=typeof SNAP!=='undefined'&&SNAP?(id?SNAP.prof&&SNAP.prof[id]:SNAP):null;let best=S&&S.hklog;
  try{const o=JSON.parse(localStorage.getItem(id?'bascula:v3:'+id:'bascula:v3')||'null');if(o&&o.hklog&&(!best||(o.hklog.e||[]).length>=(best.e||[]).length))best=o.hklog}catch(e){}
  return best||{v:1,e:[]}}
// pareja: perfiles vinculados (campo «partner» con el id del otro; sin el campo, sin pareja)
const hasPartner=p=>p&&p.partner!=null&&PROFS.some(q=>q.id===p.partner&&q.id!==p.id);
const partnerOf=p=>hasPartner(p)?PROFS.find(q=>q.id===p.partner):null;
function cycleSrc(){const own=(HKLOG.e||[]).some(e=>e[0]==='menstrual');if(own)return {log:HKLOG,who:null};
  const pp=partnerOf(PROF());if(pp&&pp.cycle)return {log:otherLog(pp.id),who:pp.name.split(' ')[0]};return {log:HKLOG,who:null}}
// PIN de privacidad (segundo PIN) para Ciclo e intimidad: por defecto 0000; se cambia en Gestionar perfiles. Solo se guarda su huella.
const privHash=async(id,pin)=>{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(`bascula-priv:${id}:${pin}`));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')};
const privKey=p=>p&&p.privH?p.privH:'0000';
// no private PIN any more: access to Íntimo is decided by the profile's modules
const privOK=()=>true;
const PRIV_UNL={};const privSet=(p,on)=>{if(on)PRIV_UNL[p.id]=privKey(p);else delete PRIV_UNL[p.id];try{on?sessionStorage.setItem('bascula:priv:'+p.id,privKey(p)):sessionStorage.removeItem('bascula:priv:'+p.id)}catch(e){}};
async function privCheck(p,pin){return p.privH?(await privHash(p.id,pin))===p.privH:pin==='0000'}
// «acceso íntimo»: se entró al perfil con el PIN privado. Sin él, el módulo Íntimo ni se ve (si el perfil tiene PIN normal y PIN privado propio)
const privAcc=p=>{try{return sessionStorage.getItem('bascula:privacc:'+p.id)===privKey(p)}catch(e){return PRIV_ACC[p.id]===privKey(p)}};
const PRIV_ACC={};const privAccSet=(p,on)=>{if(on)PRIV_ACC[p.id]=privKey(p);else delete PRIV_ACC[p.id];try{on?sessionStorage.setItem('bascula:privacc:'+p.id,privKey(p)):sessionStorage.removeItem('bascula:privacc:'+p.id)}catch(e){}};
const privVisible=()=>true;
function applyIntimoVis(){const on=privVisible();document.querySelectorAll('[data-v="intimo"]').forEach(a=>{a.hidden=!on});document.body.classList.toggle('noint',!on);return on}
const resCycle=()=>{if(typeof cycleCalc!=='function'||!privOK())return null;const s=cycleSrc(),C=cycleCalc(s.log);if(C)C.who=s.who;return C};
// la actividad sexual es compartida: la de este perfil más la de la pareja (perfil principal y perfil del ciclo)
function sexAll(){const seen=new Set(),out=[];const add=L=>{for(const e of (L.e||[]))if(e[0]==='sexual'&&!seen.has(e[1].slice(0,16))){seen.add(e[1].slice(0,16));out.push(e)}};
  const pp=partnerOf(PROF()),since=pp&&PROF().partnerSince||'';
  // lo de la pareja anterior a la fecha de inicio de la relación no se cuenta
  add(visLog(HKLOG));
  if(pp)add({e:(visLog(otherLog(pp.id)).e||[]).filter(e=>!since||e[1].slice(0,10)>=since)});return out.sort((a,b)=>a[1]<b[1]?-1:1)}// documentos de otros perfiles vistos en la colección (para pasarles datos)
const initials=n=>String(n||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();
function saveProfs(next){PROFS=next;try{localStorage.setItem('bascula:profs',JSON.stringify(PROFS))}catch(e){}if(col&&OWNER){queue.set('perfiles',{v:1,list:PROFS});drain()}renderProfBtn()}
/* ---------- PIN de cada perfil: bloqueo de la pantalla (no cifra los datos) ---------- */
const pinHash=async(id,pin)=>{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(`bascula:${id}:${pin}`));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')};
const UNL={};const unlocked=p=>{if(!p||!p.pinH)return true;if(UNL[p.id]===p.pinH)return true;try{return sessionStorage.getItem('bascula:unl:'+p.id)===p.pinH}catch(e){return false}};
const setUnlocked=p=>{UNL[p.id]=p.pinH;try{sessionStorage.setItem('bascula:unl:'+p.id,p.pinH)}catch(e){}};
let LOCK=null;// {p, buf, then, tries, until}
// after the lock every module opens again on its first tab (the module in use is kept), in every profile
function resetTabs(){try{const top=h=>{const v=(h||'').slice(1);return SUBV[v]?'#'+SUBV[v]:h};
  for(const b of Object.values(UI.byProf||{}))if(b&&typeof b==='object'){delete b.vt;delete b.lastSub;b.h=top(b.h);b.t=Date.now()}
  UI.vt={};UI.lastSub={};try{localStorage.setItem('bascula:ui',JSON.stringify(UI))}catch(e){}navPush();
  const h=top(location.hash);if(h!==location.hash)location.hash=h;else{applyVTabs();renderView()}}catch(e){}}
function showLock(p,then,mode){if(!mode)resetTabs();try{window.blUnzoom&&blUnzoom()}catch(e){}LOCK={p,buf:'',then,tries:0,until:0,mode:mode||''};drawLock();$('lock').hidden=false;document.body.classList.add('locked')}
function hideLock(){$('lock').hidden=true;LOCK=null;document.body.classList.toggle('locked',!unlocked(PROF()))}
function drawLock(){const L=LOCK,p=L.p,cur=p.id===SEL&&!unlocked(PROF());const others=PROFS.filter(q=>q.id!==p.id);
  $('lock').innerHTML=`<div class="lk"><div class="lk-logo">${(document.querySelector('.bl-ic')||{}).outerHTML||''}<span>Body<em>Lens</em></span></div><i class="lk-av" style="background:${p.col}">${esc(initials(p.name))}</i><h2>${esc(p.name)}</h2><p class="lk-msg" aria-live="polite">${L.msg||(L.mode==='priv'?'Introduce tu PIN privado para abrir Íntimo':'Introduce tu PIN')}</p>
    <div class="lk-dots">${[0,1,2,3].map(i=>`<i class="${i<L.buf.length?'on':''}"></i>`).join('')}</div>
    <div class="lk-pad">${['1','2','3','4','5','6','7','8','9','',  '0','⌫'].map(k=>k?`<button type="button" data-lk="${k}" aria-label="${k==='⌫'?'Borrar':k}">${k}</button>`:'<span></span>').join('')}</div>
    ${cur&&L.mode!=='priv'?(others.length?`<div class="lk-o"><small>Entrar con otro perfil</small>${others.map(q=>`<button type="button" data-lkp="${esc(q.id)}"><i style="background:${q.col}">${esc(initials(q.name))}</i>${esc(q.name)}</button>`).join('')}</div>`:''):'<button type="button" class="lk-x" data-lkx>Cancelar</button>'}</div>`}
async function lockKey(k){const L=LOCK;if(!L)return;if(Date.now()<L.until)return;
  if(k==='⌫'){L.buf=L.buf.slice(0,-1);L.msg='';drawLock();return}
  if(L.buf.length>=4)return;L.buf+=k;L.msg='';drawLock();
  if(L.buf.length<4)return;
  if(L.mode==='priv'){if(await privCheck(L.p,L.buf)){privSet(L.p,true);privAccSet(L.p,true);const t=L.then;hideLock();if(t)t();else renderView();return}}
  else{// the PIN decides the profile: every profile with this PIN opens, and their modules add up
    const hit=[];for(const q of PROFS)if(q.pinH&&(await pinHash(q.id,L.buf))===q.pinH)hit.push(q);
    if(hit.length){hit.forEach(setUnlocked);try{sessionStorage.setItem('bascula:grp',JSON.stringify(hit.map(q=>q.id)))}catch(e){}
      const go=hit.find(q=>q.id===L.p.id)||hit[0];try{sessionStorage.setItem('bascula:sel',go.id)}catch(e){}
      if(go.id!==SEL){hideLock();switchProfile(go.id,true);return}
      const t=L.then;hideLock();if(t)t();else{applyModVis();route()}return}}
  L.tries++;L.buf='';if(L.tries>=5){L.until=Date.now()+30000;L.tries=0;L.msg='Demasiados intentos. Espera 30 segundos.';setTimeout(()=>{if(LOCK){LOCK.msg='';drawLock()}},30000)}else L.msg='PIN incorrecto';drawLock();
  const d=document.querySelector('.lk-dots');if(d){d.classList.add('shake');setTimeout(()=>d.classList.remove('shake'),400)}}
document.addEventListener('click',e=>{const k=e.target.closest('[data-lk]');if(k){lockKey(k.dataset.lk);return}
  const q=e.target.closest('[data-lkp]');if(q){const p=PROFS.find(x=>x.id===q.dataset.lkp);if(!p)return;if(unlocked(p))return switchProfile(p.id,true);LOCK={p,buf:'',then:()=>switchProfile(p.id,true),tries:0,until:0};drawLock();return}
  if(e.target.closest('[data-lkx]'))hideLock()});
document.addEventListener('keydown',e=>{if(!LOCK)return;if(/^\d$/.test(e.key))lockKey(e.key);else if(e.key==='Backspace')lockKey('⌫');else if(e.key==='Escape'&&(LOCK.mode==='priv'||!(LOCK.p.id===SEL&&!unlocked(PROF()))))hideLock()});
function checkLock(){const p=PROF();if(!unlocked(p)){if(!LOCK)showLock(p,null)}else if(LOCK&&LOCK.p.id===SEL&&!LOCK.then)hideLock();document.body.classList.toggle('locked',!unlocked(p))}
function switchProfile(id,ok){if(id===SEL){closeProfMenu();return}const p=PROFS.find(x=>x.id===id);if(!ok&&p&&!unlocked(p)){closeProfMenu();showLock(p,()=>switchProfile(id,true));return}try{saveLocal()}catch(e){}try{sessionStorage.setItem('bascula:sel',id)}catch(e){}saveUI();UI.profile=id;UI.pfSwitch=1;try{localStorage.setItem('bascula:ui',JSON.stringify(UI))}catch(e){}location.reload()}
(()=>{try{for(const l of document.querySelectorAll('body link[rel="icon"],body link[rel="apple-touch-icon"]'))document.head.appendChild(l.cloneNode(true))}catch(e){}})();
function renderProfBtn(){const b=$('pfBtn');if(!b)return;try{$('brandSub').textContent='Salud y seguimiento · '+PROF().name.split(' ')[0]}catch(e){}try{checkLock()}catch(e){}const p=PROF();b.innerHTML=`<i style="background:${p.col}">${esc(initials(p.name))}</i><span>${esc(p.name.split(' ')[0])}</span>`;b.setAttribute('aria-label','Perfil: '+p.name+'. Cambiar de perfil')}
function closeProfMenu(){const m=$('pfMenu');if(m)m.hidden=true;const b=$('pfBtn');if(b)b.setAttribute('aria-expanded','false')}
function openProfMenu(){const m=$('pfMenu');m.innerHTML=`<div class="pfm-h">Perfiles</div>${PROFS.map(p=>`<button type="button" role="menuitemradio" aria-checked="${p.id===SEL}" data-pf="${esc(p.id)}"><i style="background:${p.col}">${esc(initials(p.name))}</i><span>${esc(p.name)}</span>${p.id===SEL?'<b>✓</b>':''}</button>`).join('')}<a class="owner-only" href="#ajustes" data-pfmanage>Gestionar perfiles</a><a class="owner-only" href="#ajustes">Ajustes</a>${PROF()&&PROF().pinH?'<button type="button" class="pfm-lock" data-pflock><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10.5" width="14" height="10" rx="2.5"/><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5"/></svg><span>Bloquear perfil</span></button>':''}`;m.hidden=false;$('pfBtn').setAttribute('aria-expanded','true')}
document.addEventListener('click',e=>{if(e.target.closest('#pfBtn')){$('pfMenu').hidden?openProfMenu():closeProfMenu();return}
  const p=e.target.closest('[data-pf]');if(p){switchProfile(p.dataset.pf);return}
  if(e.target.closest('#pfMenu a[href="#ajustes"]:not([data-pfmanage])')){closeProfMenu();setTimeout(()=>{showAj(UI.ajTab&&!AJ_PF.includes(UI.ajTab)?UI.ajTab:'plan');scrollTo(0,0)},120);return}
  // bloquear el perfil: vuelve a pedir el PIN (con el PIN privado se entra con Íntimo)
  if(e.target.closest('[data-pflock]')){closeProfMenu();const p=PROF();delete UNL[p.id];try{sessionStorage.removeItem('bascula:unl:'+p.id)}catch(_){}privSet(p,false);privAccSet(p,false);
    if(VIEW==='intimo')location.hash='#resumen';applyIntimoVis();showLock(p,null);document.body.classList.add('locked');return}
  if(e.target.closest('[data-pfmanage]')){closeProfMenu();setTimeout(()=>{showAj(UI.ajTabPf||'perfiles');scrollTo(0,0)},120);return}
  if(!e.target.closest('#pfMenu'))closeProfMenu()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeProfMenu()});
// a profile with a PIN locks itself after 1 minute without activity (here or in the pages shown inside the app)
let LAST_ACT=Date.now();window.blActivity=()=>{LAST_ACT=Date.now()};
for(const ev of ['pointerdown','pointermove','keydown','wheel','touchstart','scroll'])addEventListener(ev,()=>{LAST_ACT=Date.now()},{passive:true,capture:true});
// minutes chosen in Your account (1 by default)
const lockMs=()=>Math.max(1,+((window.BODYLENS_USER||{}).lockMin)||1)*60000;
function idleCheck(){const p=PROF();if(!p||!p.pinH||LOCK||!unlocked(p)||Date.now()-LAST_ACT<lockMs())return;
  for(const q of PROFS){delete UNL[q.id];try{sessionStorage.removeItem('bascula:unl:'+q.id)}catch(e){}}try{sessionStorage.removeItem('bascula:grp')}catch(e){}
  closeProfMenu();showLock(p,null);document.body.classList.add('locked')}
setInterval(idleCheck,5000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)idleCheck()});
// en el perfil principal, los datos del ciclo que llegan de Apple Salud pasan al perfil que los recibe
function routeCycle(){return;if(PID||!OWNER||!col||!dbFresh)return;const t=PROFS.find(p=>p.cycle&&p.id);if(!t)return;
  const mv=(HKLOG.e||[]).filter(e=>CYC_T.includes(e[0]));if(!mv.length)return;
  HKLOG={v:1,e:(HKLOG.e||[]).filter(e=>!CYC_T.includes(e[0]))};saveLocal();enqueue('hklog',HKLOG);
  const id=`pf-${t.id}-hklog`,cur=OTHER[id]||{v:1,e:[]};const nx=mergeEv(cur,{e:mv});OTHER[id]=nx;queue.set(id,nx);drain();
  try{const k='bascula:v3:'+t.id,o=JSON.parse(localStorage.getItem(k)||'null');if(o){o.hklog=mergeEv(o.hklog||{v:1,e:[]},{e:mv});localStorage.setItem(k,JSON.stringify(o))}}catch(e){}}
const newProfDoc=p=>({cfg:{...DEFAULT_CFG,start:null,goal:null,startDate:null,fileId:null,sex:p&&p.sex||''},cfgEdited:true,manual:{},notes:{},milestones:[]});

const queue=new Map();let draining=false;
// Los datos viven en una colección compartida: la leen todos los que abren el enlace con sesión iniciada; solo el dueño escribe
// iconos de acción de las listas (editar, borrar, pasar a otro perfil, mover): SVG para que se vean igual y a buen tamaño en todas partes
const ICB={x:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  edit:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg>',
  move:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h14M14 4l4 4-4 4"/><path d="M20 16H6M10 12l-4 4 4 4"/></svg>'};
const COL='bascula';let OWNER=false;
function enqueue(id,data){if(!OWNER)return;queue.set(dk(id),data);drain()}

const NS='http://www.w3.org/2000/svg';let GID=0;
function el(tag,attrs,parent){const e=document.createElementNS(NS,tag);if(attrs)for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.append(e);return e}
function txt(parent,x,y,s,attrs){const t=el('text',{x,y,...(attrs||{})},parent);t.textContent=s;return t}
function frame(host,h){host.textContent='';const w=Math.max(260,Math.round(host.clientWidth||600));const svg=el('svg',{viewBox:`0 0 ${w} ${h}`,height:h,role:'img'},host);return {svg,w,h}}
function grad(svg,color,op){const id='g'+(++GID);let d=svg.querySelector('defs');if(!d){d=el('defs');svg.prepend(d)}const g=el('linearGradient',{id,x1:0,y1:0,x2:0,y2:1},d);el('stop',{offset:'0%',style:`stop-color:${color};stop-opacity:${op}`},g);el('stop',{offset:'100%',style:`stop-color:${color};stop-opacity:0`},g);return `url(#${id})`}
function niceTicks(lo,hi,count){const span=hi-lo||1;const step0=span/count;const mag=Math.pow(10,Math.floor(Math.log10(step0)));const n=step0/mag;const step=(n<1.5?1:n<3?2:n<7?5:10)*mag;const out=[];for(let v=Math.ceil(lo/step)*step;v<=hi+1e-9;v+=step)out.push(Math.round(v*100)/100);return out}
const fmtTick=v=>Number.isInteger(v)?v.toLocaleString('es-ES'):fmtN(v,1);
function timeTicks(svg,X,k0,k1,H,m){const span=diffK(k0,k1);let lastX=-99;
  if(span>540){for(let y=+k0.slice(0,4)+1;y<=+k1.slice(0,4);y++){const k=`${y}-01-01`;const x=X(k);if(x-lastX<34)continue;lastX=x;el('line',{x1:x,x2:x,y1:m.t,y2:H-m.b,style:'stroke:var(--line2)'},svg);txt(svg,x,H-8,String(y),{'text-anchor':'middle'})}return}
  if(span>100){let d=k2d(k0);d=new Date(d.getFullYear(),d.getMonth()+1,1,12);for(;d2k(d)<=k1;d=new Date(d.getFullYear(),d.getMonth()+1,1,12)){const k=d2k(d),x=X(k);if(x-lastX<38)continue;lastX=x;el('line',{x1:x,x2:x,y1:H-m.b,y2:H-m.b+4,style:'stroke:var(--faint)'},svg);txt(svg,x,H-8,d.getMonth()?MS[d.getMonth()]:String(d.getFullYear()),{'text-anchor':'middle'})}return}
  const step=span>45?14:7;let k=k0;while(dowIdx(k)!==4)k=addK(k,1);for(;k<=k1;k=addK(k,step)){const x=X(k);if(x-lastX<44)continue;lastX=x;el('line',{x1:x,x2:x,y1:H-m.b,y2:H-m.b+4,style:'stroke:var(--faint)'},svg);txt(svg,x,H-8,fmtK(k),{'text-anchor':'middle'})}}
// Con el dedo (o en pantallas estrechas) la ficha sale fuera del gráfico, encima o, si no cabe, debajo, centrada en el dedo:
// así nunca tapa las líneas que estás recorriendo. Con ratón en pantalla ancha va junto al cursor, en la parte de arriba.
let LAST_PT='mouse';addEventListener('pointerdown',e=>{LAST_PT=e.pointerType||'mouse'},true);addEventListener('pointermove',e=>{if(e.pointerType)LAST_PT=e.pointerType},true);
function placeTip(tip,svg,w,x){const r=svg.getBoundingClientRect();const sx=x*(r.width/w||1);const tw=tip.offsetWidth,th=tip.offsetHeight;
  if(LAST_PT==='mouse'&&r.width>=560){tip.classList.remove('out');tip.style.left=Math.max(0,Math.min(r.width-tw,sx+14>r.width-tw?sx-tw-14:sx+14))+'px';tip.style.top='6px';return}
  tip.classList.add('out');const hostTop=tip.parentElement.getBoundingClientRect().top,svgTop=r.top-hostTop;
  const bar=document.querySelector('.appbar');const barBottom=bar?bar.getBoundingClientRect().bottom:0;
  tip.style.left=Math.max(0,Math.min(r.width-tw,sx-tw/2))+'px';
  tip.style.top=(r.top-th-10>barBottom?svgTop-th-10:svgTop+r.height+8)+'px'}
function split(pts,gap){const out=[];let cur=[];pts.forEach((p,i)=>{if(i&&diffK(pts[i-1].k,p.k)>gap){out.push(cur);cur=[]}cur.push(p)});if(cur.length)out.push(cur);return out}
function nearestIdx(pts,k){let lo=0,hi=pts.length-1;while(hi-lo>1){const m=(lo+hi)>>1;if(pts[m].k<k)lo=m;else hi=m}return Math.abs(diffK(pts[lo].k,k))<=Math.abs(diffK(pts[hi].k,k))?lo:hi}
const emptyBox=t=>`<div class="empty">${t}</div>`;
// Ratón: el puntero sigue al cursor. Táctil: un toque enseña el dato; para recorrer el gráfico con el dedo hay que
// mantenerlo pulsado un momento (se activa el puntero); si no, el dedo desplaza la página o cambia de sección.
let CHART_TOUCH=0;
document.addEventListener('click',e=>{const b=e.target.closest('[data-wkm],[data-wkt]');if(!b)return;if(b.dataset.wkm)UI.wkMode=b.dataset.wkm;else UI.wkMet=b.dataset.wkt;saveUI();renderView()});
function bindHover(host,hit,move,hide){
  hit.addEventListener('pointermove',e=>{if(e.pointerType!=='touch')move(e)});
  hit.addEventListener('pointerdown',e=>{if(e.pointerType==='pen'){try{hit.setPointerCapture(e.pointerId)}catch(_){}}if(e.pointerType!=='touch')move(e)});
  hit.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse')hide()});
  let timer=null,active=false,sx=0,sy=0,moved=false;const pt=t=>({clientX:t.clientX,clientY:t.clientY,pointerType:'touch',target:hit});
  const stop=()=>{clearTimeout(timer);timer=null;if(active){active=false;host.classList.remove('inspect');CHART_TOUCH=Date.now()}};
  hit.addEventListener('touchstart',e=>{if(e.touches.length!==1){stop();return}const t=e.touches[0];sx=t.clientX;sy=t.clientY;moved=false;
    clearTimeout(timer);timer=setTimeout(()=>{timer=null;if(moved)return;active=true;host.classList.add('inspect');try{navigator.vibrate&&navigator.vibrate(12)}catch(_){}move(pt({clientX:sx,clientY:sy}))},380)},{passive:true});
  hit.addEventListener('touchmove',e=>{const t=e.touches[0];if(active){e.preventDefault();move(pt(t));return}
    if(Math.abs(t.clientX-sx)>9||Math.abs(t.clientY-sy)>9){moved=true;clearTimeout(timer);timer=null}},{passive:false});
  hit.addEventListener('touchend',e=>{const wasActive=active;stop();if(!wasActive&&!moved){const t=e.changedTouches[0];move(pt(t));CHART_TOUCH=Date.now()}},{passive:true});
  hit.addEventListener('touchcancel',stop,{passive:true});
  hit.addEventListener('contextmenu',e=>e.preventDefault());
  host._hide=hide}
document.addEventListener('pointerdown',e=>{const c=e.target.closest&&e.target.closest('.chart');document.querySelectorAll('.chart').forEach(h=>{if(h!==c&&h._hide)h._hide()})},true);

/* leyendas que muestran u ocultan series: cada gráfico tiene su clave y su conjunto de series ocultas */
const HID={},REDRAW={};
function hid(key){if(!HID[key]){const saved=(UI.hid&&UI.hid[key])||[];HID[key]=new Set(saved)}return HID[key]}
const shown=(key,id)=>!hid(key).has(id);
function legendHtml(key,items){const h=hid(key);
  return items.map(it=>`<button type="button" class="lg${h.has(it.id)?' off':''}" data-lk="${key}" data-id="${esc(it.id)}" aria-pressed="${!h.has(it.id)}" title="${h.has(it.id)?'Mostrar':'Ocultar'} ${esc(it.title||it.label)}"><i class="sw ${it.sw||''}" style="${it.color?`background:${it.color};`:''}${it.style||''}"></i>${it.sub?`<span class="lgt">${it.label}<em>${it.sub}</em></span>`:it.label+(it.extra?` <em>${it.extra}</em>`:'')}</button>`).join('')}
function toggleSeries(key,id){const h=hid(key);if(h.has(id))h.delete(id);else h.add(id);UI.hid={...(UI.hid||{}),[key]:[...h]};saveUI();
  try{if(REDRAW[key])REDRAW[key]()}catch(e){console.error(e)}}
document.addEventListener('click',e=>{const b=e.target.closest('button.lg[data-lk]');if(b){toggleSeries(b.dataset.lk,b.dataset.id);return}
  const tr=e.target.closest('tr[data-att]');if(tr)toggleSeries('att',tr.dataset.att)});

function tsChart(host,o){
  const H=o.h||240;const ser=(o.series||[]).filter(s=>s&&s.pts&&s.pts.length);
  const k0=o.k0||ser.reduce((a,s)=>s.pts[0].k<a?s.pts[0].k:a,'9999-12-31');
  const k1=o.k1||ser.reduce((a,s)=>s.pts[s.pts.length-1].k>a?s.pts[s.pts.length-1].k:a,'0000-01-01');
  const vis=ser.map(s=>({...s,pts:s.pts.filter(p=>p.k>=k0&&p.k<=k1)})).filter(s=>s.pts.length);
  if(!vis.length){host.innerHTML=emptyBox(o.empty||'Sin datos en este periodo.');return null}
  const {svg,w}=frame(host,H);const m={l:o.ml??40,r:o.mr??14,t:o.mt??16,b:26};
  const ys=vis.filter(s=>!s.noScale).flatMap(s=>s.pts.map(p=>p.v));for(const r of o.refs||[])if(r.scale)ys.push(r.v);
  let lo=Math.min(...ys),hi=Math.max(...ys);if(o.zero){lo=Math.min(lo,0);hi=Math.max(hi,0)}
  const pd=Math.max((hi-lo)*0.08,o.minPad??0.3);lo-=pd;hi+=pd;
  const T0=k2d(k0).getTime(),T1=Math.max(T0+DAY,k2d(k1).getTime());
  const X=k=>m.l+(k2d(k).getTime()-T0)/(T1-T0)*(w-m.l-m.r),Y=v=>m.t+(hi-v)/(hi-lo)*(H-m.t-m.b);
  for(const b of o.bands||[]){if(b.k1<k0||b.k0>k1)continue;const x0=X(b.k0<k0?k0:b.k0),x1=X(b.k1>k1?k1:b.k1);el('rect',{x:x0,y:m.t,width:Math.max(1,x1-x0),height:H-m.t-m.b,rx:4,style:`fill:${b.fill||'var(--good-soft)'};opacity:${b.op??1}`},svg);if(b.label&&x1-x0>78)txt(svg,x0+6,m.t+13,b.label,{class:'blab'})}
  const ticks=o.yStep?(()=>{const t=[];for(let v=Math.ceil(lo/o.yStep)*o.yStep;v<=hi;v+=o.yStep)t.push(v);return t})():niceTicks(lo,hi,o.yTicks||5);
  const g=el('g',{class:'grid'},svg);for(const v of ticks){el('line',{x1:m.l,x2:w-m.r,y1:Y(v),y2:Y(v)},g);txt(svg,m.l-6,Y(v)+3.5,(o.yFmt||fmtTick)(v),{'text-anchor':'end'})}
  timeTicks(svg,X,k0,k1,H,m);
  if(o.zero)el('line',{x1:m.l,x2:w-m.r,y1:Y(0),y2:Y(0),style:'stroke:var(--faint);stroke-width:1'},svg);
  for(const r of o.refs||[]){if(r.v<lo||r.v>hi)continue;el('line',{x1:m.l,x2:w-m.r,y1:Y(r.v),y2:Y(r.v),style:`stroke:${r.color||'var(--muted)'};stroke-width:1;stroke-dasharray:4 4`},svg);if(r.label)txt(svg,w-m.r-4,Y(r.v)-5,r.label,{'text-anchor':'end',class:'rlab'})}
  if(o.markK&&o.markK>=k0&&o.markK<=k1)el('line',{x1:X(o.markK),x2:X(o.markK),y1:m.t,y2:H-m.b,style:'stroke:var(--line);stroke-dasharray:2 3'},svg);
  for(const s of vis){const segs=split(s.pts,s.gap??21);
    if(s.area){const base=o.zero?Y(0):H-m.b;const fill=grad(svg,s.color,s.areaOp??.2);for(const seg of segs){if(seg.length<2)continue;el('path',{d:'M'+seg.map(p=>`${X(p.k).toFixed(1)},${Y(p.v).toFixed(1)}`).join('L')+`L${X(seg[seg.length-1].k).toFixed(1)},${base}L${X(seg[0].k).toFixed(1)},${base}Z`,style:`fill:${fill}`},svg)}}
    if(s.line!==false)for(const seg of segs){if(seg.length>1)el('polyline',{points:seg.map(p=>`${X(p.k).toFixed(1)},${Y(p.v).toFixed(1)}`).join(' '),style:`fill:none;stroke:${s.color};stroke-width:${s.width||2};stroke-linejoin:round;stroke-linecap:round;${s.dash?`stroke-dasharray:${s.dash};`:''}opacity:${s.op??1}`},svg);else if(!s.dots)el('circle',{cx:X(seg[0].k),cy:Y(seg[0].v),r:2.4,style:`fill:${s.color}`},svg)}
    if(s.dots){const r=s.dotR||(s.pts.length>800?1.3:s.pts.length>300?2:3);const op=s.dotOp??(s.pts.length>800?.55:1);for(const p of s.pts)el('circle',{cx:X(p.k).toFixed(1),cy:Y(p.v).toFixed(1),r,style:p.hollow?`fill:var(--surface);stroke:${s.color};stroke-width:1.4`:`fill:${s.color};opacity:${op}`},svg)}
    if(s.endDot){const p=s.pts[s.pts.length-1];const x=X(p.k);el('circle',{cx:x,cy:Y(p.v),r:4.5,style:`fill:${s.color};stroke:var(--surface);stroke-width:2`},svg);if(s.endLabel)txt(svg,x+60>w?x-8:x+8,Y(p.v)-8,s.endLabel,{class:'vlab','text-anchor':x+60>w?'end':'start'})}}
  const hs=vis.find(s=>s.hover===true)||vis[Math.min(o.hover??0,vis.length-1)];
  const tip=document.createElement('div');tip.className='tip';tip.hidden=true;host.append(tip);
  const cross=el('line',{y1:m.t,y2:H-m.b,style:'stroke:var(--muted);stroke-width:1',visibility:'hidden'},svg);
  const marks=vis.map(s=>el('circle',{r:4.5,style:`fill:${s.color};stroke:var(--surface);stroke-width:2`,visibility:'hidden'},svg));
  const hit=el('rect',{x:m.l,y:0,width:Math.max(1,w-m.l-m.r),height:H,style:'fill:transparent'},svg);
  const move=ev=>{const r=svg.getBoundingClientRect();if(!r.width)return;const px=(ev.clientX-r.left)*(w/r.width);
    let a=0,b=hs.pts.length-1;while(b-a>1){const md=(a+b)>>1;if(X(hs.pts[md].k)<px)a=md;else b=md}
    const p=Math.abs(X(hs.pts[a].k)-px)<=Math.abs(X(hs.pts[b].k)-px)?hs.pts[a]:hs.pts[b];const x=X(p.k);
    cross.setAttribute('x1',x);cross.setAttribute('x2',x);cross.setAttribute('visibility','visible');
    let rows='';vis.forEach((s,j)=>{const q=s.pts[nearestIdx(s.pts,p.k)];const tol=s.tipTol??Math.max(3,(s.gap??21)/2);
      if(q&&Math.abs(diffK(q.k,p.k))<=tol){marks[j].setAttribute('cx',X(q.k));marks[j].setAttribute('cy',Y(q.v));marks[j].setAttribute('visibility','visible');if(s.label)rows+=`<div class="r"><span><i class="sw ${s.line===false?'dot':'ln'}" style="background:${s.color}"></i>${s.label}</span><span>${(s.fmt||o.vFmt||(v=>fmtN(v,1)))(q.v)}</span></div>`}
      else marks[j].setAttribute('visibility','hidden')});
    tip.innerHTML=`<b>${(o.tipTitle||(k=>fmtK(k,true)))(p.k)}</b>${rows}${o.tipExtra?o.tipExtra(p.k,p):''}`;tip.hidden=false;placeTip(tip,svg,w,x)};
  bindHover(host,hit,move,()=>{tip.hidden=true;cross.setAttribute('visibility','hidden');marks.forEach(c=>c.setAttribute('visibility','hidden'))});
  return {X,Y,svg,w,m,H};
}

function barsChart(host,items,{fmt,labelOf,tipOf,colorOf,h,bandOf}){
  const H=h||220;const vals=items.map(i=>i.v).filter(v=>v!=null);if(!vals.length){host.innerHTML=emptyBox('Sin datos suficientes todavía.');return}
  const labs=items.map((it,i)=>labelOf(it,i,items)),two=labs.some(l=>Array.isArray(l));
  const {svg,w}=frame(host,H);const m={l:38,r:8,t:18,b:two?38:26};
  const pos=vals.every(v=>v>=0);let hi=Math.max(0.2,...vals),lo=pos?0:Math.min(-0.2,...vals);const pd=(hi-lo)*0.15;hi+=pd;if(!pos)lo-=pd;
  const Y=v=>m.t+(hi-v)/(hi-lo)*(H-m.t-m.b);const bw=(w-m.l-m.r)/items.length;
  const g=el('g',{class:'grid'},svg);for(const v of niceTicks(lo,hi,4)){el('line',{x1:m.l,x2:w-m.r,y1:Y(v),y2:Y(v)},g);txt(svg,m.l-6,Y(v)+3.5,fmt(v),{'text-anchor':'end'})}
  el('line',{x1:m.l,x2:w-m.r,y1:Y(0),y2:Y(0),style:'stroke:var(--faint);stroke-width:1'},svg);
  if(bandOf)items.forEach((it,i)=>{if(bandOf(it,i))el('rect',{x:m.l+i*bw+1,y:m.t-6,width:bw-2,height:H-m.t-m.b+6,rx:6,style:WE_FILL+';pointer-events:none'},svg)});
  const tip=document.createElement('div');tip.className='tip';tip.hidden=true;host.append(tip);
  const band=el('rect',{x:0,y:m.t-6,width:Math.max(1,bw),height:H-m.t-m.b+6,rx:6,style:'fill:var(--ink);opacity:0;pointer-events:none'},svg);
  items.forEach((it,i)=>{const x=m.l+i*bw,cx=x+bw/2,bwid=Math.max(4,Math.min(bw>90?Math.min(72,bw*0.45):30,bw-6));
    if(it.v!=null){const y0=Y(0),y1=Y(it.v);const top=Math.min(y0,y1),hgt=Math.max(1.5,Math.abs(y1-y0));const r=Math.min(4,bwid/2,hgt);const up=it.v>0;
      const d=up?`M${cx-bwid/2},${y0} V${top+r} Q${cx-bwid/2},${top} ${cx-bwid/2+r},${top} H${cx+bwid/2-r} Q${cx+bwid/2},${top} ${cx+bwid/2},${top+r} V${y0} Z`
                :`M${cx-bwid/2},${y0} V${top+hgt-r} Q${cx-bwid/2},${top+hgt} ${cx-bwid/2+r},${top+hgt} H${cx+bwid/2-r} Q${cx+bwid/2},${top+hgt} ${cx+bwid/2},${top+hgt-r} V${y0} Z`;
      el('path',{d,style:`fill:${colorOf(it)}`},svg);
      if(items.length<=14||i===items.length-1)txt(svg,cx,up?top-5:top+hgt+12,fmt(it.v),{'text-anchor':'middle',class:'vlab'})}
    // etiquetas sin solaparse: se salta las que no caben según el ancho del texto
    const lw=Math.max(...labs.map(l=>Math.max(...[].concat(l).map(s=>String(s).length))))*6.6+6,step=Math.max(1,Math.ceil(lw/bw));
    if(i%step===0){const L=[].concat(labs[i]);txt(svg,cx,H-(two?22:8),L[0],{'text-anchor':'middle'});if(L[1])txt(svg,cx,H-8,L[1],{'text-anchor':'middle',class:'sub'})}});
  const hit=el('rect',{x:m.l,y:0,width:Math.max(1,w-m.l-m.r),height:H,style:'fill:transparent'},svg);
  const move=ev=>{const r=svg.getBoundingClientRect();if(!r.width)return;const px=(ev.clientX-r.left)*(w/r.width);const i=Math.max(0,Math.min(items.length-1,Math.floor((px-m.l)/bw)));const it=items[i];
    if(it.v==null){tip.hidden=true;band.style.opacity=0;return}const cx=m.l+i*bw+bw/2;band.setAttribute('x',m.l+i*bw);band.style.opacity=.09;tip.innerHTML=tipOf(it);tip.hidden=false;placeTip(tip,svg,w,cx)};
  bindHover(host,hit,move,()=>{tip.hidden=true;band.style.opacity=0});
}

function stackChart(host,o){
  const H=o.h||280;const L=o.layers;const maps=L.map(l=>new Map(l.pts.map(p=>[p.k,p.v])));
  const keys=[...maps[0].keys()].filter(k=>(!o.k0||k>=o.k0)&&maps.every(mp=>mp.has(k))).sort();
  if(keys.length<2){host.innerHTML=emptyBox('No hay suficientes mediciones de composición en este periodo.');return}

function sparkSvg(pts,color){

  const X=i=>i/(pts.length-1)*100,Y=v=>27-(v-lo)/(hi-lo)*23;const id='s'+(++GID);

}

const tnOf=col=>/--good/.test(col)?'p':/--bad|--warn/.test(col)?'n':'i';const TNL={p:['Bien','var(--good)'],n:['A mejorar','var(--bad)'],i:['Dato','var(--muted)']};const liOf=(ic,col,html)=>{const t=tnOf(col),[l,cc]=TNL[t];return `<li class="tn-${t}"><i style="background:${cc};color:#fff">${ic}</i><span>${html} <em class="tnb tnb-${t}">${l}</em></span></li>`};

  const q0=M.quality,q=q0&&{...q0,lossL:q0.lossW-q0.lossF};if(q&&q.lossW>0.5){const kg=v=>`${fmtN(Math.abs(v),1)} kg`,pc=v=>fmtInt(v/q.lossW*100)+' %';

    if(sin){const a=sinItems(t[from]);const it=a.find(x=>x.n===d);if(!it)continue;const b=sinItems(t[to]);t[to]=sinMerge([...b,{n:it.n,q:it.q}]).map(x=>fq(x.n,x.q)).join(' + ');if(mode==='move'){const r=a.filter(x=>x!==it);t[from]=r.length?r.map(x=>fq(x.n,x.q)).join(' + '):null}}
    else{const a=dishesOf(t[from]);if(!a.includes(d))continue;const b=dishesOf(t[to]);if(!b.some(x=>x.toLowerCase()===d.toLowerCase()))b.push(d);t[to]=b.join(' + ');if(mode==='move'){const r=a.filter(x=>x!==d);t[from]=r.length?r.join(' + '):null}}
    const s=(v.s||[]).slice(),man={...(v.man||{})};if(isSin(from)&&!man[from===3?5:6])s[from===3?5:6]=sinAuto(t[from]);if(isSin(to)&&!man[to===3?5:6])s[to===3?5:6]=sinAuto(t[to]);
    Y.d[k]={...v,t,s,app:1};touched.add(y);days++}
  saveLocal();if(OWNER&&col)for(const y of touched)enqueue('com-'+y,FOOD[y]);return days}

  let days=M.all.filter(p=>p.k>=k0&&p.kg!=null);if(!days.length)return null;
  if(C.allDays){const byK={};for(const p of M.all)if(p.kg!=null)byK[p.k]=p.kg;let lastKg=null;for(const p of M.all){if(p.k>=k0)break;if(p.kg!=null)lastKg=p.kg}
    const today=d2k(new Date()),out=[];for(let k=k0;k<=today;k=addK(k,1)){if(byK[k]!=null)lastKg=byK[k];const kg=lastKg!=null?lastKg:days[0].kg;out.push({k,kg,weighed:byK[k]!=null})}days=out}
  const blankSc=foodScoreOf([null,null,null,null,null,null,null],C);let e1=0,e2=0;const out=[];
  for(const p of days){const e=foodGet(p.k);let sc=foodScore(e,C);if(sc==null&&C.unlogged)sc=blankSc;
    const F=Math.min(0,goal-p.kg)/goal*C.k,q=sc==null?0:foodEstQ(F,sc,C);out.push({k:p.k,kg:p.kg,sc,F,q,logged:!!e,weighed:p.weighed!==false})}
  // lo que comes un día lo marca la báscula a la mañana siguiente: la real de cada día es la pesada siguiente
  out.forEach((x,i)=>{const nx=out[i+1];x.kgNext=nx?nx.kg:x.kg;x.real=x.kgNext-start;e1+=x.q;e2=Math.min(x.real,e2+x.q);x.e1=e1;x.e2=e2});
