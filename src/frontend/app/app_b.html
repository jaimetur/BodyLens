function parseFood(wb){const out={};

  const s=W.map((w,i)=>{const nb=[W[i-1],w,W[i+1]].filter(x=>x&&Math.abs(diffK(x.k,w.k))<=14).map(x=>x.v);return median(nb)});

    else{if(s[i]>s[ext])ext=i;else if(s[ext]-s[i]>=Z){piv.push({i:ext,t:'H'});dir=-1;ext=i}}}

  const dowAvg=dow.map(x=>x.n?{v:x.s/x.n,n:x.n}:{v:null,n:0});
  const win30=all.filter(p=>diffK(p.k,today)<30&&p.k<=today).length;
  let streak=0;for(let i=weeks.length-1;i>=0;i--){const w=weeks[i];if(w.partial||w.diff==null)continue;if(w.diff<0)streak++;else break}
  const done=weeks.filter(w=>!w.partial&&w.diff!=null);const bestW=done.length?done.reduce((a,b)=>b.diff<a.diff?b:a):null;
  const minAll=all.reduce((a,b)=>b.kg<a.kg?b:a),maxAll=all.reduce((a,b)=>b.kg>a.kg?b:a);
  const minPlan=pts.length?pts.reduce((a,b)=>b.kg<a.kg?b:a):null;
  const rate=r28&&r28.slope<0?r28.slope:null;
  const eta=kg=>{if(tNow<=kg)return lastK;if(!rate)return null;return addK(lastK,Math.ceil((kg-tNow)/rate))};
  const ms=(doc.milestones||[]).slice().sort((a,b)=>b.kg-a.kg);if(!ms.find(m=>Math.abs(m.kg-cfg.goal)<1e-6))ms.push({date:null,kg:cfg.goal});

  // intentos (el actual siempre aparece)
  const attempts=detectAttempts(all);
  let cur=attempts.find(a=>a.open||a.endK>=cfg.startDate);
  if(!cur&&hasPlan){const seg=all.filter(p=>p.k>=cfg.startDate);const st=seg[0];const lowP=seg.reduce((a,b)=>b.trend<a.trend?b:a);cur={startK:st.k,endK:lastK,lowK:lowP.k,startKg:Math.max(cfg.start,st.trend),lowKg:lowP.trend,days:diffK(st.k,lastK),open:true,reb:null,gap:0};cur.lost=cur.startKg-cur.lowKg;cur.rate=cur.days?-cur.lost/cur.days*7:0;attempts.push(cur)}
  if(cur){cur.current=true;cur.open=true}
  // años
  const yrs={};for(const p of all){const y=p.k.slice(0,4);(yrs[y]||(yrs[y]=[])).push(p)}
  const years=Object.keys(yrs).sort().map(y=>{const a=yrs[y];const v=a.map(p=>p.kg);const fat=a.map(p=>p.fp).filter(x=>x!=null),mus=a.map(p=>p.mu).filter(x=>x!=null);
    return {y,n:a.length,mean:v.reduce((s,x)=>s+x,0)/v.length,min:Math.min(...v),max:Math.max(...v),first:median(a.slice(0,7).map(p=>p.kg)),last:median(a.slice(-7).map(p=>p.kg)),fat:fat.length?median(fat):null,mus:mus.length?median(mus):null}});
  // métricas corporales
  const planK=hasPlan?cfg.startDate:null;const stats={};
  for(const id of Object.keys(MET)){if(id==='peso')continue;stats[id]=metricStats(all,id,lastK,planK)}
  const t30=trendAt(addK(lastK,-30)),t7=trendAt(addK(lastK,-7));
  stats.peso={id:'peso',v:tNow,k:lastK,stale:false,d30:t30!=null?tNow-t30:null,d7:t7!=null?tNow-t7:null,dPlan:hasPlan?tNow-cfg.start:null,base:cfg.start,wk:weekly(all,p=>p.kg)};
  const hasComp=all.some(p=>p.fp!=null);
  // calidad de la pérdida desde el inicio del plan
  let quality=null;
  if(hasPlan&&hasComp){const g=f=>({b:firstWindowMedian(all,f,cfg.startDate,14),n:windowMedian(all,f,lastK,14)});
    const W=g(p=>p.fp!=null?p.kg:null),F=g(p=>p.fm),L=g(p=>p.lean);const MU=g(p=>p.mu),WA=g(p=>p.wa),BO=g(p=>p.bo);const dl=x=>x.b!=null&&x.n!=null?x.b-x.n:null;
    if(W.b!=null&&F.b!=null&&L.b!=null&&W.n!=null&&F.n!=null&&L.n!=null){
      const lossW=W.b-W.n,lossF=F.b-F.n,lossL=L.b-L.n;
      const base={f:F.b,l:L.b};
      const ser=f=>weekly(all.filter(p=>p.k>=cfg.startDate),f);
      quality={lossW,lossF,lossL,lossMu:dl(MU),lossWa:dl(WA),lossBo:dl(BO),pctFat:lossW>0.5?lossF/lossW*100:null,fat:smooth3(ser(p=>p.fm)).map(x=>({k:x.k,v:x.v-base.f})),lean:smooth3(ser(p=>p.lean)).map(x=>({k:x.k,v:x.v-base.l}))}}}
  return {cfg,all,histK:histStart(all),pts,last,prev,lastK,tNow,today,trendAt,plan,hasPlan,r28,r14,r90,weeks,noise,dowAvg,win30,streak,bestW,minAll,maxAll,minPlan,eta,milestones,attempts,years,stats,hasComp,quality,notes:doc.notes||{}};
}
