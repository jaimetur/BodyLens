<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>BodyLens · Bienvenida</title><meta name="theme-color" content="#3B7BF2">
<link rel="icon" type="image/svg+xml" href="/icon.svg"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/pages.css"></head>
<body><main class="narrow">
  <div class="brand"><img src="/icon.svg" alt=""><b>BodyLens</b></div>
  <div class="card">
    <h1 id="t">Un momento…</h1>
    <p id="m">Estamos confirmando tu suscripción.</p>
    <div class="row" id="acts" hidden><a class="btn" href="/">Abrir BodyLens</a><a class="btn ghost" href="/login">Entrar</a></div>
  </div>
</main>
<script src="/pages.js"></script>
<script>
// back from Stripe's checkout: the account is made (or already was, by the webhook) and you are signed in
(async () => {
  const id = new URLSearchParams(location.search).get('session_id');
  for (let i = 0; i < 6; i++) {
    try {
      const r = await api('POST', '/api/web/complete', { session_id: id || '' });
      $('t').textContent = '¡Bienvenido a BodyLens!';
      $('m').textContent = r.signedIn ? 'Tu cuenta está lista. Empieza conectando tus fuentes de datos en Tu cuenta.' : 'Tu suscripción está activa. Entra con tu usuario y contraseña.';
      $('acts').hidden = false;
      if (r.signedIn) setTimeout(() => { location.href = '/'; }, 2500);
      return;
    } catch (e) { $('m').textContent = e.message; await new Promise(r => setTimeout(r, 2500)); }
  }
  $('acts').hidden = false;
})();
</script>
</body></html>
