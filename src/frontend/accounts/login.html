<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BodyLens · Entrar</title><meta name="theme-color" content="#3B7BF2">
<link rel="manifest" href="/manifest.webmanifest"><link rel="icon" type="image/svg+xml" href="/icon.svg"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/pages.css">
<style>
/* sign-in: the whole height of the phone, with the subscription well in sight */
main.login{min-height:100dvh;display:flex;flex-direction:column;justify-content:center;gap:12px;padding-top:max(20px,env(safe-area-inset-top));padding-bottom:max(20px,env(safe-area-inset-bottom))}
main.login .brand{margin-bottom:0}main.login .brand img{width:40px;height:40px}main.login .brand b{font-size:1.5rem}
main.login .card{margin:0;padding:18px}main.login .card h1{margin:0 0 4px}main.login label{margin-top:8px}main.login input{font-size:1.05rem;padding:12px}main.login #go{width:100%;padding:13px;font-size:1.05rem}main.login .row{margin-top:12px}
@media (max-height:820px){main.login .card>p:first-of-type{display:none}}
main.login p.small{margin:0}.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.foot label{display:flex;align-items:center;gap:6px;margin:0}.foot select{width:auto;padding:6px 30px 6px 10px;background-position:right 10px center}
.subcta{position:relative;overflow:hidden;border:0;border-radius:20px;padding:16px 18px;color:#fff;text-align:left;cursor:pointer;width:100%;font:inherit;
  background:linear-gradient(135deg,#6d7cf0,#9a5cf0 55%,#e0607a);box-shadow:0 18px 40px -18px #6d7cf0;animation:glow 3.5s ease-in-out infinite}
.subcta b{display:block;font-size:1.25rem;line-height:1.15}.subcta span{display:block;opacity:.92;margin-top:3px;font-size:.95rem}
.subcta i{display:inline-block;margin-top:10px;padding:9px 18px;border-radius:999px;background:#fff;color:#4b3fc8;font-style:normal;font-weight:800}
.subcta::after{content:"";position:absolute;inset:-40%;background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.35),transparent 40%);animation:shine 6s linear infinite}
@keyframes glow{50%{box-shadow:0 22px 50px -14px #9a5cf0}}@keyframes shine{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.subcta,.subcta::after{animation:none}}
/* the logo and the "Home" button go to the landing page (not in the Android app, which has no landing page) */
main.login .top{display:flex;align-items:center;justify-content:space-between;gap:10px}main.login a.brand{text-decoration:none;color:inherit}
main.login .home{padding:9px 16px;font-size:.92rem;border-radius:999px;text-decoration:none}html.inapp main.login .home{display:none}
</style></head>
<body><main class="narrow login">
  <div class="top"><a class="brand" href="/" target="_top"><img src="/icon.svg" alt=""><b>BodyLens</b></a><a class="btn ghost home" href="/" target="_top"><span aria-hidden="true">🏠</span> Página de inicio</a></div>
  <form class="card" id="f">
    <h1>Entrar</h1>
    <p>Tus datos de salud, solo para ti.</p>
    <label>Usuario o correo<input id="u" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required></label>
    <label>Contraseña<input id="p" name="password" type="password" autocomplete="current-password" required></label>
    <div class="row"><button id="go" type="submit">Entrar</button><span class="msg" id="m" aria-live="polite"></span></div>
  </form>
  <div class="card" id="hint" hidden>
    <h2>Cuenta inicial de este despliegue</h2>
    <p>Mientras no se cambie su contraseña, se puede entrar con:</p>
    <ul class="list" id="hintList"></ul>
    <p class="small">Entra con ella y cámbiale la contraseña en «Tu cuenta»: este aviso desaparecerá.</p>
  </div>
  <button type="button" class="subcta" id="subGo"><b>¿Aún no tienes cuenta?</b><span>Desde 1 € al mes · 7 días gratis · ¿Tienes un código de invitación? Úsalo aquí.</span><i>Crear mi cuenta</i></button>
  <p class="small foot"><span><a href="/help">Ayuda</a> · <a href="/privacy">Privacidad</a> · <a href="/terms">Condiciones</a></span><label>🌐 <select id="langPick" aria-label="Language"></select></label></p>
</main>
<script src="/pages.js"></script>
<script>
(async () => {
  try {
    const { accounts } = await api('GET', '/api/login-hint');
    $('hintList').innerHTML = accounts.map(a => `<li><span>usuario <code>${esc(a.username)}</code> · contraseña <code>${esc(a.password)}</code></span><button class="ghost" type="button" data-u="${esc(a.username)}" data-p="${esc(a.password)}">Usar</button></li>`).join('');
    $('hint').hidden = !accounts.length;
  } catch (e) { }
})();
document.addEventListener('click', e => { const b = e.target.closest('[data-u]'); if (b) { $('u').value = b.dataset.u; $('p').value = b.dataset.p; $('p').focus(); } });
// the sign-up opens as a sheet (a page of its own: an iframe does not size or scroll well on the iPhone)
$('subGo').addEventListener('click', () => { location.href = '/alta'; });
$('f').addEventListener('submit', async e => {
  e.preventDefault(); $('go').disabled = true; say($('m'), 'Entrando…');
  try { const r = await api('POST', '/api/login', { username: $('u').value, password: $('p').value }); location.replace(r.mustChange ? '/cuenta?cambiar=1' : safeNext()); }
  catch (err) { say($('m'), err.message, 'err'); $('go').disabled = false; }
});
</script>
</body></html>
