<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BodyLens · Entrar</title><meta name="theme-color" content="#3B7BF2">
<link rel="manifest" href="/manifest.webmanifest"><link rel="icon" type="image/svg+xml" href="/icon.svg"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/pages.css"></head>
<body><main class="narrow">
  <div class="brand"><img src="/icon.svg" alt=""><b>BodyLens</b></div>
  <form class="card" id="f">
    <h1>Entrar</h1>
    <p>Tus datos de salud, solo para ti.</p>
    <label>Usuario o correo<input id="u" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required></label>
    <label>Contraseña<input id="p" name="password" type="password" autocomplete="current-password" required></label>
    <div class="row"><button id="go" type="submit">Entrar</button><span class="msg" id="m" aria-live="polite"></span></div>
  </form>
  <div class="card" id="hint" hidden>
    <h2>Cuenta inicial de este despliegue</h2>
    <p>Mientras no se cambie su contraseña, se puede entrar con:</p>
    <ul class="list" id="hintList"></ul>
    <p class="small">Entra con ella y cámbiale la contraseña en «Tu cuenta»: este aviso desaparecerá.</p>
  </div>
  <p class="small">¿No tienes cuenta? <a href="/solicitar">Pide una</a>.</p>
  <p class="small"><a href="/help">Ayuda</a></p>
  <p class="small langp"><label>🌐 <select id="langPick" aria-label="Language"></select></label></p>
</main>
<script src="/pages.js"></script>
<script>
(async () => {
  try {
    const { accounts } = await api('GET', '/api/login-hint');
    $('hintList').innerHTML = accounts.map(a => `<li><span>usuario <code>${esc(a.username)}</code> · contraseña <code>${esc(a.password)}</code></span><button class="ghost" type="button" data-u="${esc(a.username)}" data-p="${esc(a.password)}">Usar</button></li>`).join('');
    $('hint').hidden = !accounts.length;
  } catch (e) { }
})();
document.addEventListener('click', e => { const b = e.target.closest('[data-u]'); if (b) { $('u').value = b.dataset.u; $('p').value = b.dataset.p; $('p').focus(); } });
$('f').addEventListener('submit', async e => {
  e.preventDefault(); $('go').disabled = true; say($('m'), 'Entrando…');
  try { const r = await api('POST', '/api/login', { username: $('u').value, password: $('p').value }); location.replace(r.mustChange ? '/cuenta?cambiar=1' : safeNext()); }
  catch (err) { say($('m'), err.message, 'err'); $('go').disabled = false; }
});
</script>
</body></html>
