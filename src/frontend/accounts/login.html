<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BodyLens · Entrar</title><meta name="theme-color" content="#3B7BF2">
<link rel="manifest" href="/manifest.webmanifest"><link rel="icon" type="image/svg+xml" href="/icon.svg"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/pages.css">
<style>
/* sign-in: the whole height of the phone, with the subscription well in sight */
main.login{min-height:100dvh;display:flex;flex-direction:column;justify-content:center;gap:16px;padding-top:max(20px,env(safe-area-inset-top));padding-bottom:max(20px,env(safe-area-inset-bottom))}
main.login .brand{margin-bottom:4px}main.login .brand img{width:52px;height:52px}main.login .brand b{font-size:1.9rem}
main.login .card{margin:0}main.login input{font-size:1.05rem;padding:14px}main.login #go{width:100%;padding:15px;font-size:1.05rem}
.subcta{position:relative;overflow:hidden;border:0;border-radius:22px;padding:22px;color:#fff;text-align:left;cursor:pointer;width:100%;font:inherit;
  background:linear-gradient(135deg,#6d7cf0,#9a5cf0 55%,#e0607a);box-shadow:0 18px 40px -18px #6d7cf0;animation:glow 3.5s ease-in-out infinite}
.subcta b{display:block;font-size:1.45rem;line-height:1.15}.subcta span{display:block;opacity:.92;margin-top:4px}
.subcta i{display:inline-block;margin-top:14px;padding:11px 20px;border-radius:999px;background:#fff;color:#4b3fc8;font-style:normal;font-weight:800}
.subcta::after{content:"";position:absolute;inset:-40%;background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.35),transparent 40%);animation:shine 6s linear infinite}
@keyframes glow{50%{box-shadow:0 22px 50px -14px #9a5cf0}}@keyframes shine{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.subcta,.subcta::after{animation:none}}
.subdlg{position:fixed;inset:0;z-index:50;background:rgba(5,8,14,.6);display:flex;align-items:flex-end;justify-content:center}
.subdlg[hidden]{display:none}
.subdlg>div{position:relative;width:min(560px,100%);height:min(94dvh,860px);border-radius:24px 24px 0 0;overflow:hidden;background:var(--bg);animation:up .35s cubic-bezier(.2,.8,.2,1)}
@media (min-width:700px){.subdlg{align-items:center}.subdlg>div{border-radius:24px}}
.subdlg iframe{border:0;width:100%;height:100%;display:block}
.subdlg button.x{position:absolute;top:10px;right:10px;z-index:2;width:38px;height:38px;border-radius:50%;border:0;background:rgba(0,0,0,.35);color:#fff;font-size:1rem}
@keyframes up{from{transform:translateY(40px);opacity:0}}
</style></head>
<body><main class="narrow login">
  <div class="brand"><img src="/icon.svg" alt=""><b>BodyLens</b></div>
  <form class="card" id="f">
    <h1>Entrar</h1>
    <p>Tus datos de salud, solo para ti.</p>
    <label>Usuario o correo<input id="u" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required></label>
    <label>Contraseña<input id="p" name="password" type="password" autocomplete="current-password" required></label>
    <div class="row"><button id="go" type="submit">Entrar</button><span class="msg" id="m" aria-live="polite"></span></div>
  </form>
  <div class="card" id="hint" hidden>
    <h2>Cuenta inicial de este despliegue</h2>
    <p>Mientras no se cambie su contraseña, se puede entrar con:</p>
    <ul class="list" id="hintList"></ul>
    <p class="small">Entra con ella y cámbiale la contraseña en «Tu cuenta»: este aviso desaparecerá.</p>
  </div>
  <button type="button" class="subcta" id="subGo"><b>¿Aún no tienes cuenta?</b><span>Suscríbete desde 1 € al mes. Los primeros 7 días son gratis. ¿Tienes un código de invitación? Úsalo aquí.</span><i>Crear mi cuenta</i></button>
  <p class="small"><a href="/help">Ayuda</a> · <a href="/privacy">Privacidad</a> · <a href="/terms">Condiciones</a></p>
  <p class="small langp"><label>🌐 <select id="langPick" aria-label="Language"></select></label></p>
</main>
<div class="subdlg" id="subDlg" hidden role="dialog" aria-modal="true" aria-label="Suscripción"><div><button type="button" class="x" id="subX" aria-label="Cerrar">✕</button><iframe id="subFrame" title="Suscripción"></iframe></div></div>
<script src="/pages.js"></script>
<script>
(async () => {
  try {
    const { accounts } = await api('GET', '/api/login-hint');
    $('hintList').innerHTML = accounts.map(a => `<li><span>usuario <code>${esc(a.username)}</code> · contraseña <code>${esc(a.password)}</code></span><button class="ghost" type="button" data-u="${esc(a.username)}" data-p="${esc(a.password)}">Usar</button></li>`).join('');
    $('hint').hidden = !accounts.length;
  } catch (e) { }
})();
document.addEventListener('click', e => { const b = e.target.closest('[data-u]'); if (b) { $('u').value = b.dataset.u; $('p').value = b.dataset.p; $('p').focus(); } });
// the subscription dialog: the sign-up page in a sheet over the sign-in
$('subGo').addEventListener('click', () => { $('subFrame').src = '/alta?embed=1'; $('subDlg').hidden = false; document.body.style.overflow = 'hidden'; });
const closeSub = () => { $('subDlg').hidden = true; $('subFrame').src = 'about:blank'; document.body.style.overflow = ''; };
$('subX').addEventListener('click', closeSub);
$('subDlg').addEventListener('click', e => { if (e.target === $('subDlg')) closeSub(); });
window.blBack = () => { if (!$('subDlg').hidden) { closeSub(); return true; } return false; };
// Google Play tells the result to this page (the app's main frame): it goes on to the dialog
window.blPurchase = r => { try { $('subFrame').contentWindow.blPurchase(r); } catch (e) {} };
$('f').addEventListener('submit', async e => {
  e.preventDefault(); $('go').disabled = true; say($('m'), 'Entrando…');
  try { const r = await api('POST', '/api/login', { username: $('u').value, password: $('p').value }); location.replace(r.mustChange ? '/cuenta?cambiar=1' : safeNext()); }
  catch (err) { say($('m'), err.message, 'err'); $('go').disabled = false; }
});
</script>
</body></html>
