name: 🤖 App Android

# Compila la app de Android (Health Connect → servidor de BodyLens) cuando cambia android/ y deja el APK en la
# release «android-latest» del repositorio (el almacén de artefactos de Actions está lleno). tools/deploy-android.sh
# lo baja de ahí y lo pone en el NAS, que lo sirve en /android.apk.
on:
  push:
    branches: [main, "[0-9]+.[0-9]+.[0-9]+"]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

concurrency:
  group: bodylens-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.11.1"
      - name: Firma (si hay almacén de claves en los secretos)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/bodylens.jks"; echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/bodylens.jks" >> "$GITHUB_ENV"; fi
      - name: Compilar
        working-directory: android
        env:
          BODYLENS_ANDROID_BUILD: ${{ github.run_number }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease
      - name: Publicar en la release android-latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk bodylens-android.apk
          gh release view android-latest >/dev/null 2>&1 || gh release create android-latest --prerelease \
            --title "App Android (última)" --notes "APK de la app de Android de BodyLens. Se rehace con cada cambio en android/."
          gh release upload android-latest bodylens-android.apk --clobber
          echo "build ${{ github.run_number }} · ${GITHUB_SHA::7}" > android-build.txt
          gh release upload android-latest android-build.txt --clobber
