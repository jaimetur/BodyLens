name: 🤖 Android app

# Builds the Android app (Health Connect → BodyLens server).
# - On every change in android/ it refreshes the rolling "android-latest" pre-release (the Actions artifact storage is
#   full), from which tools/deploy-android.sh takes the APK to the NAS, which serves it at /android.apk.
# - Called by release.yml with a release tag, it attaches the APK to that version's release instead.
# - On a version branch (X.Y.Z), with the PLAY_SERVICE_ACCOUNT_JSON secret, each build (also run by hand) goes to
#   Google Play (tools/play_publish.py), named "X.Y.Z (build)" like the app (versionName = the release version,
#   versionCode = the build number), to the track of the PLAY_TRACK variable (by default alpha, the closed test), with
#   the release notes of the version's block in CHANGELOG.md. If versionName is not the branch, it fails. It runs last:
#   a Play error leaves the job red but the APKs are already published. When the version reaches main, release.yml
#   takes this build to production.
on:
  push:
    branches: [main, "[0-9]+.[0-9]+.[0-9]+"]
    paths: ["android/**", ".github/workflows/android.yml", "tools/play_publish.py"]
  workflow_dispatch:
  workflow_call:
    inputs:
      release_tag:
        description: "Release (vX.Y.Z) to attach the APK to"
        type: string
        required: true

concurrency:
  group: bodylens-android-${{ github.ref }}-${{ inputs.release_tag || 'rolling' }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.11.1"
      - name: Signing key (if the keystore is in the secrets)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/bodylens.jks"; echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/bodylens.jks" >> "$GITHUB_ENV"; fi
      - name: Build
        working-directory: android
        env:
          BODYLENS_ANDROID_BUILD: ${{ github.run_number }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        # two apps: BodyLens (the whole app: APK to install directly, AAB for Google Play) and BodyLens Bridge (APK)
        run: gradle --no-daemon assembleFullRelease bundleFullRelease assembleBridgeRelease
      - name: Publish to the rolling android-latest pre-release
        if: ${{ !inputs.release_tag }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/full/release/app-full-release.apk bodylens-android.apk
          cp android/app/build/outputs/apk/bridge/release/app-bridge-release.apk bodylens-bridge.apk
          cp android/app/build/outputs/bundle/fullRelease/app-full-release.aab bodylens-android.aab
          TITLE="Android app (rolling build)"
          NOTES="Latest APKs of the Android apps, rebuilt on every change in android/: bodylens-android.apk is the whole BodyLens app, bodylens-bridge.apk is BodyLens Bridge (it only sends Health Connect data); bodylens-android.aab is the whole app for Google Play. It is a rolling build (hence a pre-release); each version's files are attached to its own vX.Y.Z release."
          if gh release view android-latest >/dev/null 2>&1; then
            gh release edit android-latest --title "$TITLE" --notes "$NOTES" --prerelease
          else
            gh release create android-latest --prerelease --title "$TITLE" --notes "$NOTES"
          fi
          gh release upload android-latest bodylens-android.apk bodylens-bridge.apk bodylens-android.aab --clobber
          echo "build ${{ github.run_number }} · ${GITHUB_SHA::7}" > android-build.txt
          gh release upload android-latest android-build.txt --clobber
      - name: Upload to Google Play (release branches)
        if: ${{ !inputs.release_tag }}
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          PLAY_TRACK: ${{ vars.PLAY_TRACK || 'alpha' }}
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "Not a release branch: not uploaded to Google Play."; exit 0; fi
          if [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then echo "::warning title=Google Play::No PLAY_SERVICE_ACCOUNT_JSON secret: the AAB was not uploaded to Google Play."; exit 0; fi
          VERSION=$(sed -n 's/^ *versionName *= *"\([^"]*\)".*/\1/p' android/app/build.gradle.kts)
          if [ "$VERSION" != "$GITHUB_REF_NAME" ]; then echo "::error title=Google Play::versionName $VERSION is not the release $GITHUB_REF_NAME (run tools/CreateUpdateRelease.py --update)"; exit 1; fi
          pip install -q google-auth requests
          python tools/play_publish.py bundle bodylens-android.aab --track "$PLAY_TRACK" --name "$VERSION (${{ github.run_number }})" \
            --version "$VERSION"
          echo "::notice title=Google Play::$VERSION (${{ github.run_number }}) uploaded to the $PLAY_TRACK track"
      - name: Attach to the version release
        if: ${{ inputs.release_tag }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          T="${{ inputs.release_tag }}"
          cp android/app/build/outputs/apk/full/release/app-full-release.apk "bodylens-android-$T.apk"
          cp android/app/build/outputs/bundle/fullRelease/app-full-release.aab "bodylens-android-$T.aab"
          cp android/app/build/outputs/apk/bridge/release/app-bridge-release.apk "bodylens-bridge-$T.apk"
          gh release upload "$T" "bodylens-android-$T.apk" "bodylens-android-$T.aab" "bodylens-bridge-$T.apk" --clobber
