name: 🚀 Release

# Publishes the GitHub release of a BodyLens version (vX.Y.Z, from pyproject.toml), as DriveTest Analyzer does:
# notes taken from that version's block in CHANGELOG.md (without its "📱 Google Play" sections, which are only for the
# store), the source code and the Android APK of the version.
# - Every push to main (when a version branch is merged): publishes it as final, the latest release, with no manual
#   step; if the version already has a release, it is published again on the new commit.
# - Manual run (Actions → 🚀 Release → Run workflow): recreates the release and its tag on the commit built; "final"
#   makes it the latest release, otherwise it is a pre-release.
# - Pushing a tag vX.Y.Z publishes it as final (docker.yml also builds the image jaimetur/bodylens:X.Y.Z for the tag).
# A final release also goes to Google Play: the build the testers have in the closed test (PLAY_TRACK, alpha by
# default) goes to the stable track of the PLAY_STABLE_TRACK variable (production), with the version's release notes,
# without building it again (tools/play_publish.py promote). Without that variable, until Google gives the app access
# to production, the version stays in the closed test.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      final_release:
        description: "Final release (otherwise a pre-release)"
        type: boolean
        default: true

concurrency:
  group: bodylens-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Version
        id: version
        shell: bash
        run: |
          VERSION=$(python3 -c "import re,pathlib;print(re.search(r'^version\s*=\s*\"([^\"]+)\"',pathlib.Path('pyproject.toml').read_text(),re.M).group(1))")
          if [[ "${GITHUB_REF}" == refs/tags/v* && "${GITHUB_REF_NAME}" != "v${VERSION}" ]]; then
            echo "The tag ${GITHUB_REF_NAME} does not match the version in pyproject.toml (${VERSION})." >&2; exit 1
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "tag=v${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Release notes from the changelog
        shell: bash
        run: |
          mkdir -p dist
          python3 - "${{ steps.version.outputs.version }}" <<'PY'
          import re, sys
          from pathlib import Path
          version = sys.argv[1]
          text = Path("CHANGELOG.md").read_text(encoding="utf-8")
          m = re.search(rf"^## Release: v{re.escape(version)}\s*$(.*?)(?=^---\s*$|^## Release:|\Z)", text, re.M | re.S)
          if not m:
              sys.exit(f"Release v{version} not found in CHANGELOG.md")
          notes = re.sub(r"^#### 📱 Google Play \([\w-]+\):?[ \t]*\n.*?(?=^#### |\Z)", "", m.group(1), flags=re.M | re.S)
          Path("dist/release_notes.md").write_text(notes.strip() + "\n", encoding="utf-8")
          PY
          cat dist/release_notes.md

      - name: Source code
        run: git archive --format=zip --prefix="BodyLens-${{ steps.version.outputs.version }}/" -o "dist/BodyLens_${{ steps.version.outputs.version }}_source.zip" HEAD

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          FINAL: ${{ github.event_name == 'push' || inputs.final_release }}
        shell: bash
        run: |
          # a push to main or a manual run recreates the release and its tag on the commit built; a tag push keeps the
          # tag it came with
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [[ "${GITHUB_REF_TYPE}" == "branch" ]]; then gh release delete "$TAG" --yes --cleanup-tag; else gh release delete "$TAG" --yes; fi
          elif [[ "${GITHUB_REF_TYPE}" == "branch" ]] && git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            git push origin ":refs/tags/$TAG"
          fi
          flags=(--title "$TAG" --notes-file dist/release_notes.md --target "${GITHUB_SHA}")
          if [[ "$FINAL" == "true" ]]; then flags+=(--latest); else flags+=(--prerelease); fi
          gh release create "$TAG" dist/*.zip "${flags[@]}"

  android:
    needs: publish
    uses: ./.github/workflows/android.yml
    with:
      release_tag: ${{ needs.publish.outputs.tag }}
    secrets: inherit

  play:
    needs: publish
    if: ${{ github.event_name == 'push' || inputs.final_release }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Google Play, from the closed test to the stable track
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          PLAY_TRACK: ${{ vars.PLAY_TRACK || 'alpha' }}
          PLAY_STABLE_TRACK: ${{ vars.PLAY_STABLE_TRACK }}
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          if [ -z "$PLAY_STABLE_TRACK" ]; then echo "::notice title=Google Play::No PLAY_STABLE_TRACK variable: $VERSION stays in the $PLAY_TRACK track. Set it to production once Google gives the app access to production."; exit 0; fi
          if [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then echo "::warning title=Google Play::No PLAY_SERVICE_ACCOUNT_JSON secret: $VERSION was not sent to the $PLAY_STABLE_TRACK track."; exit 0; fi
          pip install -q google-auth requests
          python tools/play_publish.py promote "$VERSION" --from "$PLAY_TRACK" --track "$PLAY_STABLE_TRACK"
          echo "::notice title=Google Play::$VERSION sent to the $PLAY_STABLE_TRACK track"
