name: 🐳 Tests and Docker build

# Work happens on the current version branch (e.g. 0.1.0): every push builds the "latest" image and the version's
# tag, which is what the NAS runs. main is brought up to date from time to time (image "main"); a tag vX.Y.Z builds
# the image X.Y.Z (release.yml publishes the GitHub release).
on:
  push:
    branches: [main, "[0-9]+.[0-9]+.[0-9]+"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: bodylens-docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Backend tests
        run: |
          pip install -e ".[test]"
          python -m pytest -q
      - name: Page start-up and translator tests
        run: |
          (cd src/frontend && npm ci --no-audit --no-fund --ignore-scripts)
          node tests/frontend/smoke.mjs
          node tests/frontend/i18n.mjs

  docker:
    needs: tests
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Image name and tags
        id: image
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        shell: bash
        run: |
          USERNAME_VALUE="${DOCKERHUB_USERNAME:-${{ github.repository_owner }}}"
          IMAGE="${USERNAME_VALUE}/bodylens"
          {
            echo "username=${USERNAME_VALUE}"
            echo "tags<<EOF"
            echo "${IMAGE}:sha-${GITHUB_SHA::7}"
            if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then echo "${IMAGE}:${GITHUB_REF_NAME#v}"; fi
            if [[ "${GITHUB_REF}" == refs/heads/main ]]; then echo "${IMAGE}:main"; fi
            # version branch (0.1.0…): its tag and "latest", which is what the NAS runs
            if [[ "${GITHUB_REF_NAME}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "${IMAGE}:${GITHUB_REF_NAME}"; echo "${IMAGE}:latest"; fi
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Sign in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ steps.image.outputs.username }}
          password: ${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKERHUB_PASSWORD }}

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Build and push (amd64 + arm64)
        uses: docker/build-push-action@v7
        env:
          # no build record artifact (the Actions storage quota is full)
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.tags }}
          build-args: |
            SOURCE_REVISION=${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=registry,ref=${{ steps.image.outputs.username }}/bodylens:buildcache
          cache-to: type=registry,ref=${{ steps.image.outputs.username }}/bodylens:buildcache,mode=max
