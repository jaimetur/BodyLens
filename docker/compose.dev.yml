# Desarrollo con recarga automática: docker compose -f docker/compose.dev.yml up --build
# La página se sirve directamente desde frontend/src (sin compilar) y el backend se recarga al guardar.
services:
  bodylens:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      COOKIE_SECURE: "0"
      SCHEDULER_ENABLED: "${SCHEDULER_ENABLED:-0}"
      SYNC_INTERVAL_MIN: "${SYNC_INTERVAL_MIN:-15}"
      GOOGLE_SERVICE_ACCOUNT_JSON: "${GOOGLE_SERVICE_ACCOUNT_JSON:-}"
      PUBLIC_URL: "http://localhost:8000"
    ports:
      - "8000:8000"
    volumes:
      - ../backend/app:/app/backend/app
      - ../frontend/src:/app/frontend/src
      - ../frontend/server:/app/frontend/server
      - ../data-dev:/data
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app/backend/app"]
